<!DOCTYPE html>
<meta charset="utf-8">
<title>@@TITLE@@</title>
<style>
@@CSS@@
</style>
<header>
@@HEADER@@
</header>
<div id="main">
  <div id="tower">
    <table>
      <colgroup>
        <col class="c-pos"><col class="c-bar"><col class="c-drv"><col class="c-delta">
        <col class="c-lead"><col class="c-int"><col class="c-tyre"><col class="c-flag">
      </colgroup>
      <thead><tr>
        <th class="pos">P</th><th class="bar"></th><th>Driver</th>
        <th title="Places gained or lost since the start">+/-</th>
        <th>Leader</th><th>Int</th><th>Tyre</th><th></th>
      </tr></thead>
      <tbody id="slots"></tbody>
    </table>
  </div>
  <div id="stage">
    <canvas id="c" width="@@W@@" height="@@H@@"></canvas>
    <svg id="compass" viewBox="0 0 54 54">
      <circle cx="27" cy="27" r="24" fill="rgba(18,18,21,.92)"
              stroke="#33333d" stroke-width="1.2"/>
      <circle cx="27" cy="27" r="19" fill="none" stroke="#26262e"
              stroke-width=".8"/>
      <!-- Rotates with the map: the whole rose turns, the labels stay upright. -->
      <g id="needle">
        <line x1="27" y1="8" x2="27" y2="46" stroke="#26262e" stroke-width=".8"/>
        <line x1="8" y1="27" x2="46" y2="27" stroke="#26262e" stroke-width=".8"/>
        <path d="M27 9 L31 27 L27 24 L23 27 Z" fill="#e10600"/>
        <path d="M27 45 L23 27 L27 30 L31 27 Z" fill="#4c4c58"/>
      </g>
      <circle cx="27" cy="27" r="2.2" fill="#16161a" stroke="#4c4c58"
              stroke-width="1"/>
      <text id="nlabel" fill="#f0f0f2" font-size="9" font-weight="700"
            text-anchor="middle" dominant-baseline="central"
            font-family="-apple-system, sans-serif">N</text>
    </svg>
  </div>
</div>
<div id="controls">
  <button id="play">Pause</button>
  <input type="range" id="seek" min="0" max="@@LAST@@" value="0">
  <label style="color:var(--dim);font-size:12px">Speed
    <select id="speed">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select>
  </label>
  <span class="legend">
    <span class="key"><svg width="14" height="10" viewBox="0 0 14 10">
      <line x1="3" y1="1" x2="3" y2="9" stroke="#e10600" stroke-width="1.8"/>
      <path d="M8 5 L13 2.5 L13 7.5 Z" fill="#e10600"/>
    </svg> start/finish</span>
    <span class="key"><svg width="18" height="8" viewBox="0 0 18 8">
      <line x1="1" y1="4" x2="17" y2="4" stroke="rgba(232,193,28,.6)"
            stroke-width="1.6" stroke-dasharray="4 3"/>
      <circle cx="6" cy="4" r="1.6" fill="rgba(232,193,28,.9)"/>
      <circle cx="12" cy="4" r="1.6" fill="rgba(232,193,28,.9)"/>
    </svg> pit lane + boxes</span>
  </span>
  <!-- Width and colour live in replay.css (#battles) — it must never reflow. -->
  <span id="battles"></span>
  <span id="clock">0.0s</span>
</div>
<script id="replay-data" type="application/json">@@DATA@@</script>
<script>
@@JS@@</script>
